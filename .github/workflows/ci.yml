name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04 # host only runs the container; pinned so runner image moves do not surprise us
    # Same distribution as the main development machine (Debian 13, Qt 6.8)
    container: debian:trixie
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git ca-certificates \
            qt6-base-dev qt6-base-private-dev \
            libavformat-dev libavcodec-dev libswresample-dev libswscale-dev libavutil-dev libminiaudio-dev \
            libavfilter-dev qt6-shader-baker \
            ffmpeg xvfb xauth locales ccache
          # Locale-aware sorting and German number format are tested; default "C" locale breaks them
          sed -i 's/^# *de_DE.UTF-8/de_DE.UTF-8/' /etc/locale.gen
          locale-gen
      - uses: actions/checkout@v5
      # ccache between runs: only the files changed since the last run are compiled again (CMakeLists.txt uses ccache
      # when it is installed). A new key each run, restored from the newest one before
      - name: Compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-linux-${{ github.run_id }}
          restore-keys: ccache-linux-
      - name: Configure
        run: cmake -S . -B build -G Ninja -DSCHNEIDI_TESTS=ON
      - name: Build
        # $PWD, not github.workspace: in a container job that expression is the host's path
        run: |
          export CCACHE_DIR="$PWD/.ccache" CCACHE_BASEDIR="$PWD" CCACHE_MAXSIZE=1500M
          cmake --build build
          ccache --show-stats
      - name: Test
        # Widget tests and fonts need an X server (-j4 was no faster: the heavy tests encode with several threads themselves)
        env:
          LANG: de_DE.UTF-8
        run: xvfb-run -a ctest --test-dir build --output-on-failure -j2

  # Without Qt RHI (no qt6-base-private-dev: some distributions, Windows without the private headers) the GPU parts
  # compile to stubs; nothing else builds them, so a stub that drifts from its header went unnoticed (b8a99b2)
  linux-no-rhi:
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git ca-certificates qt6-base-dev \
            libavformat-dev libavcodec-dev libswresample-dev libswscale-dev libavutil-dev libminiaudio-dev ccache
      - uses: actions/checkout@v5
      # ccache between runs: only the files changed since the last run are compiled again (CMakeLists.txt uses ccache
      # when it is installed). A new key each run, restored from the newest one before
      - name: Compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-no-rhi-${{ github.run_id }}
          restore-keys: ccache-no-rhi-
      - name: Configure
        run: cmake -S . -B build -G Ninja -DSCHNEIDI_RHI=OFF
      - name: Build
        # $PWD, not github.workspace: in a container job that expression is the host's path
        run: |
          export CCACHE_DIR="$PWD/.ccache" CCACHE_BASEDIR="$PWD" CCACHE_MAXSIZE=1500M
          cmake --build build
          ccache --show-stats
