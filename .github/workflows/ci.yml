name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest
    # Same distribution as the main development machine (Debian 13, MLT 7.30, Qt 6.8)
    container: debian:trixie
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git ca-certificates \
            qt6-base-dev libmlt++-dev libmlt-dev libmlt-data \
            ffmpeg frei0r-plugins
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -G Ninja -DSCHNEIDI_TESTS=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure -j2
